name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de CI
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Comprobar sintaxis y shellcheck
        run: make lint

      - name: Pruebas
        run: make test

      - name: Comprobar el instalador
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          ./install.sh --help
          ./uninstall.sh --help
